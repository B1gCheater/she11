# =============================================================================
# she11_server.toml - relay runtime configuration
# -----------------------------------------------------------------------------
# Source template : config/she11_server.toml
# Copied next to the relay binary by:
#     python builder.py server --gen-config
#
# This file is NOT compiled into the binary. The relay reads it at startup:
#     ./she11_server -c she11_server.toml
# or simply ./she11_server, which looks for ./she11_server.toml when no other
# flags are given.
#
# THE VALUES BELOW ARE PLACEHOLDERS. Every CHANGE-ME string and every 127.0.0.0
# address is deliberately unusable: a relay started from this file as-is will
# fail instead of quietly serving with a guessable password. Edit the file
# before the first start.
# =============================================================================

# -----------------------------------------------------------------------------
# IDENTITY - shown in the commander roster and health output.
# -----------------------------------------------------------------------------
[identity]
name        = "relay-1"      # default: OS hostname
public_addr = ""             # cosmetic, e.g. "relay.example.com:2079"

# -----------------------------------------------------------------------------
# LISTEN - the two planes are separated on purpose: a role is fixed at accept
# time, and a client never shares a port with a commander.
#
#   bare port "2077"   -> dual-stack on every NIC
#   "0.0.0.0:2077"     -> IPv4 only
#   "[::]:2077"        -> IPv6 (plus IPv4-mapped) only
#
# The same port number on UDP and TCP does not conflict (different sockets).
# Production defaults used by the documentation: client 2077/2088,
# commander 2079/2080. The 127.0.0.0 addresses below are placeholders that do
# not bind on a normal host; replace them.
# -----------------------------------------------------------------------------
[[listen.client]]            # target machines dial this plane
proto = "udp"                # QUIC; primary transport
addr  = "127.0.0.0:4444"

[[listen.client]]
proto = "tcp"                # TLS 1.3 + yamux fallback
addr  = "127.0.0.0:4445"

[[listen.commander]]         # operator consoles dial this plane
proto = "udp"
addr  = "127.0.0.0:4446"

[[listen.commander]]
proto = "tcp"
addr  = "127.0.0.0:4447"

# -----------------------------------------------------------------------------
# TLS - both files are required; there is no plaintext mode.
# Generate a keypair with:
#     python builder.py gencert --out ./server.crt --key ./server.key
# The same certificate must be embedded in every client and commander at build
# time (--server-cert), so rotating it means rebuilding them.
# Relative paths resolve against the relay's working directory.
# -----------------------------------------------------------------------------
[tls]
cert = "./server.crt"
key  = "./server.key"

# -----------------------------------------------------------------------------
# AUTH
#
# magic_list: a client is accepted only if the magic compiled into its binary
#             is in this list (constant-time compare). Minimum 16 characters;
#             use one long random string per fleet and rotate by building new
#             clients.
#
# commander_password: every commander must send exactly this value. It is also
#             stored in each operator's she11_commander.toml. Use a long random
#             value, never a login password.
#
# Lockout: after max_wrong_attempts bad passwords from one source IP, that IP
#          is banned for wrong_ban_seconds.
# -----------------------------------------------------------------------------
[auth]
magic_list         = ["CHANGE-ME-fleet-magic-at-least-16-chars"]
commander_password = "CHANGE-ME-commander-password"
max_wrong_attempts = 3
wrong_ban_seconds  = 60

# -----------------------------------------------------------------------------
# LIMITS - these protect the relay process only. The per-client shell cap is a
# client-side setting (--max-shell) and is enforced by the client itself.
# 0 means unlimited everywhere.
# -----------------------------------------------------------------------------
[limits]
max_commander      = 20       # concurrent commander connections
max_clients        = 2000     # registered client connections (one per transport)
max_sessions_total = 0        # relay sessions on this server
open_shell_timeout = 5        # seconds to wait for OPEN -> SESSION_ACCEPT

# -----------------------------------------------------------------------------
# LOGGING - empty folder means write nothing.
# When set, two subdirectories are created automatically:
#   <folder>/connection/YYYY-MM-DD.log      one line per connection event
#   <folder>/shell_dump/<shell>_<sid>.log   raw session input/output
#
# shell_dump captures everything an operator types, including secrets. Keep the
# directory at mode 0700 and treat it as sensitive. Nothing is rotated or
# deleted automatically.
# -----------------------------------------------------------------------------
[log]
folder = ""
level  = "info"               # info | debug | warn | error
